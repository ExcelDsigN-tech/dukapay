groups:
  - name: api_health
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.instance }}"

      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "P99 latency is {{ $value }}s for {{ $labels.instance }}"

      - alert: LowThroughput
        expr: rate(http_requests_total[5m]) < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low request throughput"
          description: "Request rate is {{ $value }} req/s for {{ $labels.instance }}"

  - name: business_metrics
    interval: 60s
    rules:
      - alert: HighFloatUtilization
        expr: (dukapay_float_utilized / dukapay_float_total) > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Float utilization exceeds 90%"
          description: "Current utilization: {{ $value | humanizePercentage }}"

      - alert: LowRepaymentRate
        expr: rate(dukapay_loans_repaid_total[1h]) / rate(dukapay_loans_disbursed_total[1h]) < 0.85
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Repayment rate below threshold"
          description: "Repayment rate: {{ $value | humanizePercentage }}"

      - alert: HighDefaultRate
        expr: rate(dukapay_loans_defaulted_total[24h]) / rate(dukapay_loans_disbursed_total[24h]) > 0.05
        for: 2h
        labels:
          severity: critical
        annotations:
          summary: "Default rate exceeds 5%"
          description: "Default rate: {{ $value | humanizePercentage }}"

  - name: infrastructure
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space"
          description: "Only {{ $value }}% disk space remaining on {{ $labels.instance }}"

      - alert: HighDatabaseConnections
        expr: pg_stat_database_numbackends > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database connection count"
          description: "{{ $value }} active connections on {{ $labels.instance }}"

      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database is down"
          description: "PostgreSQL instance {{ $labels.instance }} is not responding"
