# DukaPay PgBouncer configuration (issue #444)
# Run PgBouncer between the API and Postgres to pool connections across
# replicas. The API Pool keeps max=10 connections (backend/src/db/connection.ts);
# PgBouncer caps total DB connections to pool_mode transaction + max_client_conn.
[databases]
* = host=postgres port=5432 dbname=dukapay

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 300
server_lifetime = 3600
max_connections = 60
log_connections = 0
log_disconnections = 0
application_name_add_host = 1