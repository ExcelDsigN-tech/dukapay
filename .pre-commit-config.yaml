repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        args: [--check]

  - repo: local
    hooks:
      - id: backend-lint-typecheck
        name: Backend lint and typecheck
        entry: bash -c 'cd backend && npm run lint && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^backend/
      - id: frontend-lint-typecheck
        name: Frontend lint and typecheck
        entry: bash -c 'cd frontend && npm run lint && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^frontend/
