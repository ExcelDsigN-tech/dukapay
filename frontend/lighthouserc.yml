{
  "ci": {
    "throws": "budget",
    "assert": {
      "assertions": {
        "categories:performance": ["error", { "minScore": 0.8 }],
        "categories:accessibility": ["warn", { "minScore": 0.9 }]
      }
    },
    "collect": {
      "startServerCommand": "npm run start",
      "startServerTimeout": 30000,
      "url": ["http://localhost:3000/"]
    },
    "upload": {
      "target": "temporary-public-storage"
    }
  }
}