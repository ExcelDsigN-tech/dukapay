[package]
name = "dukapay-indexer"
version = "0.1.0"
edition = "2021"
description = "Standalone high-throughput Soroban event indexer for DukaPay"
license = "MIT"

[[bin]]
name = "dukapay-indexer"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-std", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
prometheus = "0.13"
once_cell = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono"], optional = true }
rdkafka = { version = "0.36", features = ["cmake-build"], optional = true }
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["postgres"]
postgres = ["dep:sqlx"]
kafka = ["dep:rdkafka"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
