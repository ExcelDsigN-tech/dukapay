name: Bug Report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        **Title format:** Start the title with a component prefix, e.g. `[frontend] Balance widget shows stale value`. See CONTRIBUTING.md for the full prefix list.
  - type: dropdown
    id: area
    attributes:
      label: Component
      description: Which part of DukaPay does this affect?
      multiple: false
      options:
        - backend
        - contracts
        - frontend
        - sdk
        - indexer
        - scripts
        - docs
        - ci
        - infra
        - security
        - tests
        - ops
        - product
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
