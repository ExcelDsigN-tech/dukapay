name: Feature Request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature!

        **Title format:** Start the title with a component prefix, e.g. `[frontend] Add offline balance caching`. See CONTRIBUTING.md for the full prefix list.
  - type: dropdown
    id: area
    attributes:
      label: Component
      description: Which part of DukaPay does this affect?
      multiple: false
      options:
        - backend
        - contracts
        - frontend
        - sdk
        - indexer
        - scripts
        - docs
        - ci
        - infra
        - security
        - tests
        - ops
        - product
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
