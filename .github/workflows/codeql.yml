name: CodeQL

# Static security analysis for:
# - backend/ and frontend/ (JavaScript/TypeScript)
# - contracts/ (Rust/Soroban smart contracts)
# Complements the supply-chain-audit job in ci.yml by catching SQL injection,
# prototype pollution, XSS, path traversal, and ReDoS before they ship.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC — catches newly-published query updates.
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - rust
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # JS/TS needs no compilation; autobuild is a no-op safeguard.
      - name: Autobuild JS/TS
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4

      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable # not SHA-pinned: rolling channel branch (stable/beta/nightly track new Rust releases); pinning would freeze the toolchain version
        with:
          targets: wasm32-unknown-unknown

      - name: Build Soroban contracts workspace
        if: matrix.language == 'rust'
        working-directory: contracts
        run: cargo build --workspace --target wasm32-unknown-unknown

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:${{ matrix.language }}"
