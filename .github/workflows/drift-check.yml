name: Environment Drift Sweep

on:
  schedule:
    - cron: '0 3 * * *' # nightly at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install script deps
        working-directory: scripts
        run: npm ci

      - name: Run drift sweep
        id: sweep
        working-directory: scripts
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set +e
          npx tsx drift-check.ts --format markdown --output ../drift-report.md --remediate
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat ../drift-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open remediation PR for non-secret drift
        if: steps.sweep.outputs.exit_code == '1' && hashFiles('drift-remediation.md') != ''
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/env-drift-remediation
          title: 'chore: environment drift remediation'
          body-path: drift-remediation.md
          labels: infra, drift
          add-paths: |
            drift-report.md

      - name: Alert on drift
        if: steps.sweep.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Environment drift detected — see the job summary and the remediation PR.');

      - name: Fail the job on sweep error
        if: steps.sweep.outputs.exit_code == '2'
        run: |
          echo "::error::drift-check.ts crashed"
          exit 1
