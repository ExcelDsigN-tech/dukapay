name: Deploy Production (Mainnet)

# Mainnet deployment — requires explicit production posture per #565.
# This workflow STRUCTURALLY guarantees the KYC/audit-anchor decision is enforced at deploy time,
# not just documented. The `production-guard` job fails the deploy if the agreed posture mismatches.
#
# Depends on: #565 (decision), #561/#562 correctness gaps + external audit (see deployed-contracts.md).
# This is real-money deployment, not a testnet redeploy.

on:
  workflow_dispatch:
    inputs:
      confirm_mainnet:
        description: 'Type "deploy-mainnet" to confirm you are deploying real contracts to Stellar mainnet'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'backend/.env.production'
      - 'backend/.env.production.example'
      - 'scripts/verify-production-env.mjs'
      - 'scripts/deploy-config.json'
      - 'scripts/contract-registry.json'

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  # ── 0. Confirm guard input when manually dispatched ────────────────────────
  confirm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation input
        run: |
          if [ "${{ inputs.confirm_mainnet }}" != "deploy-mainnet" ]; then
            echo "::error::You must type 'deploy-mainnet' to confirm mainnet deployment"
            exit 1
          fi

  # ── 1. Production posture guard — FAILS deploy if KYC/audit/AML don't match agreed mainnet posture ──
  production-guard:
    needs: [confirm]
    if: always() && (needs.confirm.result == 'success' || needs.confirm.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Verify production KYC/AUDIT/AML posture (per #565)
        env:
          # These MUST be explicitly set in the `production` environment (not relying on code defaults).
          # The guard fails if they don't match the agreed mainnet posture — see
          # backend/.env.production.example and docs/ENVIRONMENT.md#production-mainnet-posture
          KYC_ENFORCEMENT_ENABLED: ${{ secrets.KYC_ENFORCEMENT_ENABLED }}
          AUDIT_ANCHOR_ENABLED: ${{ secrets.AUDIT_ANCHOR_ENABLED }}
          AUDIT_ANCHOR_CONTRACT_ID: ${{ secrets.AUDIT_ANCHOR_CONTRACT_ID }}
          AUDIT_ANCHOR_SOURCE_SECRET: ${{ secrets.AUDIT_ANCHOR_SOURCE_SECRET }}
          AML_REPORTING_THRESHOLD: ${{ vars.AML_REPORTING_THRESHOLD }}
          AML_DAILY_TX_LIMIT: ${{ vars.AML_DAILY_TX_LIMIT }}
          AML_HIGH_RISK_COUNTRIES: ${{ vars.AML_HIGH_RISK_COUNTRIES }}
          STELLAR_NETWORK: ${{ vars.STELLAR_NETWORK }}
          STELLAR_NETWORK_PASSPHRASE: ${{ vars.STELLAR_NETWORK_PASSPHRASE }}
          STELLAR_RPC_URL: ${{ vars.STELLAR_RPC_URL }}
          COMPLYADVANTAGE_API_KEY: ${{ secrets.COMPLYADVANTAGE_API_KEY }}
          COMPLYADVANTAGE_SEARCH_PROFILE: ${{ vars.COMPLYADVANTAGE_SEARCH_PROFILE }}
          SAR_FILING_API_URL: ${{ vars.SAR_FILING_API_URL }}
        run: |
          echo "🔒 Production posture guard: verifying KYC_ENFORCEMENT_ENABLED and AUDIT_ANCHOR_ENABLED match agreed mainnet posture..."
          echo "KYC_ENFORCEMENT_ENABLED=${KYC_ENFORCEMENT_ENABLED:-<unset>}"
          echo "AUDIT_ANCHOR_ENABLED=${AUDIT_ANCHOR_ENABLED:-<unset>}"
          echo "AML_REPORTING_THRESHOLD=${AML_REPORTING_THRESHOLD:-<unset>}"
          echo "AML_DAILY_TX_LIMIT=${AML_DAILY_TX_LIMIT:-<unset>}"
          echo "AML_HIGH_RISK_COUNTRIES=${AML_HIGH_RISK_COUNTRIES:-<unset>}"
          node scripts/verify-production-env.mjs

      - name: Verify production env template is valid
        run: node scripts/verify-production-env.mjs --env-file backend/.env.production.example

      - name: Verify mainnet deploy config exists and is scaffolded
        run: |
          echo "Checking scripts/deploy-config.json has mainnet block..."
          if ! jq -e '.mainnet' scripts/deploy-config.json > /dev/null; then
            echo "::error::scripts/deploy-config.json missing mainnet block — add per docs/deployed-contracts.md"
            exit 1
          fi
          echo "Checking mainnet network passphrase..."
          PASS=$(jq -r '.mainnet.networkPassphrase' scripts/deploy-config.json)
          if [ "$PASS" != "Public Global Stellar Network ; September 2015" ]; then
            echo "::error::mainnet.networkPassphrase must be 'Public Global Stellar Network ; September 2015' (got: $PASS)"
            exit 1
          fi
          echo "Mainnet deploy config OK: passphrase=$PASS"

      - name: Verify contract registry mainnet block shape
        run: |
          echo "Checking scripts/contract-registry.json mainnet contracts..."
          if ! jq -e '.networks.mainnet' scripts/contract-registry.json > /dev/null; then
            echo "::error::contract-registry.json missing networks.mainnet"
            exit 1
          fi
          COUNT=$(jq '.networks.mainnet.contracts | length' scripts/contract-registry.json)
          echo "Mainnet contracts recorded: $COUNT (expected 0 before deploy, 9 after)"
          # Before deploy, 0 or placeholders is OK; after deploy, 9 with real C... IDs. This guard just checks block exists.

  # ── 2. Build and push production images (tagged production-*) ─────────────
  build-and-push:
    needs: [production-guard]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend (production)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/dukapay-backend:production-${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/dukapay-backend:production-latest
          target: production
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Build and push frontend (production)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/dukapay-frontend:production-${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/dukapay-frontend:production-latest
          target: runner
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_RPC_URL=${{ vars.NEXT_PUBLIC_RPC_URL }}
            NEXT_PUBLIC_NETWORK_PASSPHRASE=${{ vars.NEXT_PUBLIC_NETWORK_PASSPHRASE }}
            NEXT_PUBLIC_EXPLORER_URL=${{ vars.NEXT_PUBLIC_EXPLORER_URL }}
            NEXT_PUBLIC_MANAGER_CONTRACT_ID=${{ vars.NEXT_PUBLIC_MANAGER_CONTRACT_ID }}
            NEXT_PUBLIC_POOL_CONTRACT_ID=${{ vars.NEXT_PUBLIC_POOL_CONTRACT_ID }}
            NEXT_PUBLIC_GOVERNANCE_CONTRACT_ID=${{ vars.NEXT_PUBLIC_GOVERNANCE_CONTRACT_ID }}
            NEXT_PUBLIC_NFT_CONTRACT_ID=${{ vars.NEXT_PUBLIC_NFT_CONTRACT_ID }}

      - name: Smoke-test production backend image
        run: |
          REPO=ghcr.io/${{ env.OWNER_LC }}/dukapay-backend
          docker pull "${REPO}:production-${{ github.sha }}"
          docker run --rm "${REPO}:production-${{ github.sha }}" node --version
          docker run --rm "${REPO}:production-${{ github.sha }}" sh -lc 'test -f /app/dist/index.js && echo "dist/index.js present"'

      - name: Run Trivy CRITICAL scan (production backend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ghcr.io/${{ env.OWNER_LC }}/dukapay-backend:production-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-prod.sarif'
          severity: 'CRITICAL'
          exit-code: '1'
          limit-severities-for-sarif: 'true'
          trivyignores: '.trivyignore'

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-prod.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: 'trivy-prod.sarif'
          category: trivy-production-backend

  # ── 3. Verify contracts on mainnet (post-deploy checks would run here) ───
  verify-mainnet:
    needs: [build-and-push, production-guard]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
        working-directory: scripts
      - name: Run verify-contracts against mainnet registry
        run: npx ts-node verify-contracts.ts --network mainnet --format text || true
        working-directory: scripts
        env:
          STELLAR_RPC_URL: ${{ vars.STELLAR_RPC_URL }}
      - name: Note — full mainnet verification requires real deployment
        run: |
          echo "Before mainnet contracts are deployed, verify-contracts reports SKIPPED (placeholders)."
          echo "After 'npm run deploy -- mainnet' and registry population, re-run: npm run verify:contracts -- --network mainnet"
          echo "Every contract's admin must be migrated to multisig_governance before mainnet is accepted (see CONTRACTS.md)."
