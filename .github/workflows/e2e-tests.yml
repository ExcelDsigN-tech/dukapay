name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/e2e-tests.yml'
  push:
    branches: [main]

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1/3, 2/3, 3/3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        working-directory: frontend
        run: |
          npx playwright test \
            --project=${{ matrix.browser }} \
            --shard=${{ matrix.shard }} \
            --grep-invert="@flaky" \
            --reporter=html,json
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            frontend/test-results/
            frontend/screenshots/
          retention-days: 7

  flaky-tests:
    name: Flaky Tests (Non-blocking)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run flaky tests
        working-directory: frontend
        run: |
          npx playwright test \
            --project=chromium \
            --grep="@flaky" \
            --reporter=html,json
        env:
          CI: true

      - name: Upload flaky test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-flaky-report
          path: frontend/playwright-report/
          retention-days: 30

  merge-reports:
    name: Merge Test Reports
    if: always()
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Display structure
        run: ls -R all-reports/

      - name: Merge reports (if available)
        continue-on-error: true
        run: |
          if [ -d "all-reports" ]; then
            echo "Reports found, merging..."
            # Custom merge logic can be added here
          fi

  test-summary:
    name: Test Summary
    if: always()
    needs: [e2e-tests, flaky-tests]
    runs-on: ubuntu-latest
    
    steps:
      - name: E2E Test Summary
        run: |
          echo "### 🎭 E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Flaky Tests**: ${{ needs.flaky-tests.result }} (non-blocking)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Agent Onboarding & KYC" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cash-in/Cash-out Flow" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Loan Application → Approval → Funding" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Loan Repayment" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dispute Filing" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Float Transfer" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Settlement" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Complete User Journey" >> $GITHUB_STEP_SUMMARY
