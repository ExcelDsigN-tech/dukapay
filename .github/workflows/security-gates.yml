name: Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  socket-supply-chain:
    name: Socket malicious package blocking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Socket Firewall blocks installs when its supply-chain analysis finds a
      # malicious package. Pin the action itself to an immutable commit.
      - uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
      - name: Analyze npm lockfiles
        shell: bash
        run: |
          for directory in backend frontend scripts; do
            (cd "$directory" && sfw npm ci --ignore-scripts)
          done
      - name: Analyze Cargo lockfile
        run: sfw cargo fetch --locked
        working-directory: contracts

  semgrep:
    name: Semgrep SAST
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      # Pinned to a specific release, not `latest`: a mutable tag lets a
      # compromised or buggy upstream image silently change what every PR
      # is scanned with.
      image: semgrep/semgrep:1.174.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: semgrep scan --config p/ci --config p/sql-injection --error --exclude='**/node_modules/**' --exclude='**/target/**'

  gitleaks:
    name: Gitleaks secrets
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Pinned to a commit SHA (not the `v2` tag) so the action's code can't
      # change under us without a reviewed bump here — a tag can be
      # repointed by whoever controls the upstream repo.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy filesystem scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Was pinned to `@master`, a mutable branch — the least hermetic
      # reference possible for a security-scanning action. Pinned to a
      # commit SHA on a tagged release instead.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  npm-audit:
    name: npm audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        directory: [backend, frontend, scripts]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.directory }}
      - run: npm audit --audit-level=high
        working-directory: ${{ matrix.directory }}

  cargo-audit:
    name: cargo audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable # not SHA-pinned: rolling channel branch (stable/beta/nightly track new Rust releases); pinning would freeze the toolchain version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: contracts

  weekly-report:
    name: Weekly vulnerability report
    if: always() && github.event_name == 'schedule'
    needs: [socket-supply-chain, semgrep, gitleaks, trivy, npm-audit, cargo-audit]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Publish security-team report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOCKET_RESULT: ${{ needs.socket-supply-chain.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          NPM_RESULT: ${{ needs.npm-audit.result }}
          CARGO_RESULT: ${{ needs.cargo-audit.result }}
        run: |
          title="Weekly vulnerability report - $(date -u +%Y-%m-%d)"
          body=$(cat <<EOF
          Automated security scan summary:

          - Socket supply chain: ${SOCKET_RESULT}
          - Semgrep: ${SEMGREP_RESULT}
          - Gitleaks: ${GITLEAKS_RESULT}
          - Trivy: ${TRIVY_RESULT}
          - npm audit: ${NPM_RESULT}
          - cargo audit: ${CARGO_RESULT}

          Detailed findings remain in the restricted workflow logs: ${RUN_URL}
          EOF
          )
          gh issue create --repo "$REPOSITORY" --title "$title" --body "$body" --label security
